services:
  opspilot:
    build: .
    ports:
      - "8443:8443"
    environment:
      OPSPILOT_DATA_DIR: /var/lib/opspilot
      OPSPILOT_ADMIN_PASSWORD: ${OPSPILOT_ADMIN_PASSWORD:-}
      OPSPILOT_OLLAMA_BASE_URL: ${OPSPILOT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPSPILOT_OLLAMA_MODEL: ${OPSPILOT_OLLAMA_MODEL:-qwen2.5:7b}
      OPSPILOT_INTERVAL_SECONDS: ${OPSPILOT_INTERVAL_SECONDS:-30}
      OPSPILOT_GLOBAL_AUTO_MODE: ${OPSPILOT_GLOBAL_AUTO_MODE:-false}
    volumes:
      - opspilot-data:/var/lib/opspilot
    restart: unless-stopped

volumes:
  opspilot-data:
